[workspace]
authors = ["Sébastien Boisgérault <Sebastien.Boisgerault@gmail.com>"]
channels = ["conda-forge"]
name = "pytorch"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.13.3,<3.14"
pytorch = ">=2.6.0,<3"
torchvision = ">=0.21.0,<0.22"
numpy = ">=2.2.6,<3"
scipy = ">=1.15.2,<2"
pandas = ">=2.2.3,<3"
matplotlib = ">=3.10.3,<4"
pillow = ">=11.2.1,<12"
tqdm = ">=4.67.1,<5"
jupyterlab = ">=4.4.2,<5"
marimo = ">=0.13.6,<0.14"
scikit-learn = ">=1.6.1,<2"
graphviz = ">=12.2.1,<13"
seaborn = ">=0.13.2,<0.14"
tensorboard = ">=2.19.0,<3"
pyarrow = ">=20.0.0,<21"

[pypi-dependencies]
torchviz = ">=0.0.3, <0.0.4"
ucimlrepo = ">=0.0.7, <0.0.8"
